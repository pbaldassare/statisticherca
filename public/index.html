<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000734" />
    <title>Statistiche RCA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span>
            <strong>Statistiche RCA</strong>
            <small>Preventivi anonimi</small>
          </span>
        </div>
        <nav class="side-nav" aria-label="Sezioni"></nav>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Assicurapp</p>
            <h1 id="page-title">Panoramica</h1>
          </div>
          <form id="filters" class="filters">
            <label>Dal <input type="date" name="from" required /></label>
            <label>Al <input type="date" name="to" required /></label>
            <label>Veicolo
              <select name="veicolo">
                <option value="tutti">Tutti</option>
                <option value="rca_auto">Auto</option>
                <option value="rca_moto">Moto</option>
                <option value="rca_autocarri">Autocarri</option>
              </select>
            </label>
            <button type="submit">Aggiorna</button>
          </form>
        </header>
        <main id="content" class="content"></main>
      </div>
    </div>
    <nav class="bottom-nav" aria-label="Sezioni"></nav>
    <script type="module" src="/app.js"></script>
  </body>
</html>
